version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - perfsprint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      - path: (_test\.go|freeboxtest/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
